<!DOCTYPE html>
<html lang="en">
<head>

<title>Ledger — Expense Tracker</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root{
    --paper:#F5F7F3; --ink:#16241F; --peso:#1F6F54; --peso-soft:#E4EEE8;
    --ballpen:#2D5FA6; --ballpen-soft:#E3EAF4; --brick:#B23A2E; --brick-soft:#F6E4E1;
    --amber:#B4790F; --amber-soft:#F5EAD9; --muted:#5C6D63; --line:#D8DED4;
    --surface:#FFFFFF; --shadow:rgba(22,36,31,0.08); --overlay:rgba(16,32,26,0.5);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0F1D18; --ink:#EAEEE9; --peso:#49AD84; --peso-soft:#153228;
      --ballpen:#87B0EA; --ballpen-soft:#17263C; --brick:#E58374; --brick-soft:#3A1E1C;
      --amber:#E0AD5C; --amber-soft:#332811; --muted:#8FA398; --line:#25352C;
      --surface:#16241E; --shadow:rgba(0,0,0,0.4); --overlay:rgba(6,12,10,0.65);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px; padding-block:20px;
  }
  h1,h2,h3{font-family:'IBM Plex Serif',Georgia,serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  #app{max-width:560px; margin:0 auto;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit; font-size:15px;}
  a{color:var(--ballpen);}

  /* -------- gate -------- */
  .gate-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center;}
  .gate-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:32px 28px; box-shadow:0 2px 10px var(--shadow);}
  .wordmark{font-family:'IBM Plex Serif'; font-weight:700; font-size:26px; letter-spacing:-0.02em; margin-bottom:4px;
    display:flex; align-items:baseline; gap:8px;}
  .wordmark .peso-mark{color:var(--peso);}
  .gate-sub{color:var(--muted); font-size:14px; margin-bottom:24px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-bottom:6px;}
  .field input, .field select{
    width:100%; height:44px; border:1px solid var(--line); border-radius:9px; background:var(--paper);
    color:var(--ink); padding:0 13px;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--peso); outline-offset:1px;}
  .field-hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .check-row{display:flex; align-items:center; gap:9px; margin-bottom:16px;}
  .check-row input[type="checkbox"]{width:18px; height:18px; accent-color:var(--peso); flex-shrink:0; background:none; border:none; padding:0;}
  .check-row label{margin:0; text-transform:none; font-weight:600; font-size:14px; letter-spacing:0; color:var(--ink);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:44px; padding:0 20px; border-radius:9px; border:none;
    background:var(--peso); color:#fff; font-weight:600; font-size:15px; width:100%;
  }
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.small{height:36px; padding:0 14px; font-size:13px; width:auto;}
  .btn.danger{background:var(--brick);}
  .btn.outline-peso{background:transparent; color:var(--peso); border:1.5px solid var(--peso);}
  .btn.outline-ballpen{background:transparent; color:var(--ballpen); border:1.5px solid var(--ballpen);}
  .btn-pair{display:flex; gap:8px; margin-bottom:16px;}
  .btn-pair .btn{width:auto; flex:1; padding:0 8px; font-size:13.5px;}
  .pay-hub-section{margin-bottom:20px;}
  .pay-hub-section:last-child{margin-bottom:0;}
  .err-text{color:var(--brick); font-size:13px; margin-top:10px; min-height:16px;}
  .back-link{background:none; border:none; color:var(--ballpen); font-size:13px; padding:0; margin-bottom:16px; font-weight:600;}

  /* -------- app shell -------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px;}
  .who{font-size:13px; color:var(--muted);}
  .who b{color:var(--ink); font-weight:600;}
  .switch-btn{background:none; border:none; color:var(--ballpen); font-size:13px; font-weight:600; padding:4px 0;}

  .tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:4px; margin-bottom:20px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .tab{flex:0 0 auto; white-space:nowrap; text-align:center; padding:10px 14px; border-radius:8px; font-weight:600; font-size:13.5px; border:none; background:transparent; color:var(--muted);}
  .tab.active{background:var(--peso); color:#fff;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:18px; box-shadow:0 1px 3px var(--shadow); margin-bottom:16px;}
  .card h3{font-size:15px; margin-bottom:12px;}
  .row-between{display:flex; align-items:center; justify-content:space-between;}
  .section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 0 10px;}

  .tf-select{display:flex; gap:6px; margin-bottom:16px;}
  .tf-btn{flex:1; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px;}
  .tf-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .gauge-track{height:9px; background:var(--line); border-radius:5px; overflow:hidden; margin:10px 0 14px;}
  .gauge-fill{height:100%; border-radius:5px; transition:width .25s ease;}
  .budget-figures{display:flex; justify-content:space-between; font-size:13px;}
  .budget-figures .amt{font-size:17px; display:block; margin-top:2px;}
  .warn-line{display:flex; align-items:center; gap:6px; margin-top:12px; font-size:12.5px; font-weight:600;}

  .balance-list{display:flex; flex-direction:column; gap:0;}
  .balance-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);}
  .balance-row:last-child{border-bottom:none;}
  .balance-row[data-account]{cursor:pointer;}
  .balance-row[data-account]:hover .name{text-decoration:underline;}
  .balance-row .name{font-weight:600; font-size:14px;}
  .balance-row .type{font-size:12px; color:var(--muted);}
  .balance-row.credit{flex-direction:column; align-items:stretch; gap:8px;}
  .balance-row.credit .credit-top{display:flex; justify-content:space-between; align-items:center;}
  .credit-gauge-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
  .credit-gauge-fill{height:100%; border-radius:4px;}
  .credit-figures{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted);}
  .pay-btn{background:var(--ballpen-soft); color:var(--ballpen); border:none; border-radius:7px; height:30px; padding:0 12px; font-size:12.5px; font-weight:600; align-self:flex-start;}

  .ledger-row{display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); gap:10px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .ledger-cat{font-weight:600; font-size:14px;}
  .ledger-meta{font-size:12px; color:var(--muted);}
  .ledger-tags{display:flex; gap:6px; margin-top:3px; flex-wrap:wrap;}
  .tag{font-size:11px; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted);}
  .tag.person{background:var(--ballpen-soft); color:var(--ballpen); border-color:transparent; font-weight:600;}
  .ledger-amt{font-weight:600; font-size:14.5px; white-space:nowrap;}
  .empty-note{color:var(--muted); font-size:13.5px; text-align:center; padding:28px 0;}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; font-size:13px; border:1px solid var(--line); background:var(--paper);}
  .chip button{background:none; border:none; color:var(--muted); font-size:14px; line-height:1; padding:0;}
  .inline-add{display:flex; gap:8px;}
  .inline-add input{flex:1;}

  .source-card{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  .source-top{display:flex; justify-content:space-between; align-items:center;}
  .source-edit{display:flex; gap:8px; margin-top:8px;}
  .source-edit input{flex:1; height:36px;}
  .icon-btn{background:none; border:none; color:var(--brick); font-size:16px; padding:2px 4px;}

  .loan-card{border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;}
  .loan-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .loan-figures{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin:8px 0 4px;}
  .loan-actions{display:flex; gap:8px; margin-top:10px;}
  .loan-actions .pay-btn{flex:1; text-align:center;}
  .loan-actions .pay-btn.secondary{background:var(--brick-soft); color:var(--brick);}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .stat-tile .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700;}
  .stat-tile .value{font-size:21px; margin-top:5px;}

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-label{width:92px; font-size:12.5px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; height:14px; background:var(--line); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}
  .bar-val{width:78px; text-align:right; font-size:12.5px; flex-shrink:0;}

  /* -------- modal -------- */
  .modal-overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0;}
  @media (min-width:520px){ .modal-overlay{align-items:center; padding:20px;} }
  .modal{background:var(--surface); width:100%; max-width:460px; max-height:92vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));}
  @media (min-width:520px){ .modal{border-radius:16px;} }
  .modal h2{font-size:19px; margin-bottom:4px;}
  .modal-sub{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .modal-close{position:absolute; top:0; right:0;}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
  .x-btn{background:none; border:none; font-size:20px; color:var(--muted); line-height:1; padding:2px 4px;}
  .btn-row{display:flex; gap:10px; margin-top:20px;}
  .btn-row .btn{width:auto; flex:1;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:11px 20px; border-radius:9px; font-size:13.5px; font-weight:500; z-index:100; box-shadow:0 4px 14px var(--shadow);
    opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}

  footer.security-note{margin-top:28px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.5;}
</style>
</head>
<body>

<script type="module">

import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, addDoc,
  query, where, orderBy, limit, onSnapshot, runTransaction
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlOMuZy75yiB82SKUl0amUwZZ_GcT6HVY",
  authDomain: "expensetracker-3b47f.firebaseapp.com",

  storageBucket: "expensetracker-3b47f.firebasestorage.app",
  messagingSenderId: "754439634375",
  appId: "1:754439634375:web:ce5ae95bc3a7356753ade2"

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const PAYMENT_METHODS = ['Cash','GCash','Debit Card','Credit Card'];
const SOURCE_TYPES = ['Credit Card','Debit Card','Bank Account','Cash','E-Wallet (GCash/PayMaya)'];
const BUDGET_EXCLUDED_CATEGORIES = ['Bills','Utilities'];

const RECEIVABLES_IMPORT = [
  {debtorName:"Tita Belen", item:"Aircon", monthlyAmount:3191.58, termMonths:24, startDate:"2025-12-01", balance:44682.12},
  {debtorName:"Kuya", item:"Battery", monthlyAmount:3070.00, termMonths:12, startDate:"2025-12-01", balance:17418.17},
  {debtorName:"Mama", item:"Aircon", monthlyAmount:6479.67, termMonths:3, startDate:"2025-10-01", balance:0.00},

  {debtorName:"Kuya", item:"Cash", monthlyAmount:2746.83, termMonths:12, startDate:"2025-12-01", balance:16481.00},
  {debtorName:"Vince", item:"Motor", monthlyAmount:7728.12, termMonths:12, startDate:"2026-01-01", balance:25171.81},
  {debtorName:"Kuya", item:"Phone", monthlyAmount:1983.17, termMonths:10, startDate:"2026-02-01", balance:10084.16},
  {debtorName:"Kuya Kambal", item:"Phone", monthlyAmount:3495.00, termMonths:12, startDate:"2026-04-01", balance:24048.00},
  {debtorName:"Kuya Ichi", item:"Phone", monthlyAmount:2458.00, termMonths:24, startDate:"2026-08-01", balance:48992.00},
  {debtorName:"Dodge", item:"Phone", monthlyAmount:1000.00, termMonths:24, startDate:"2025-05-01", balance:7000.00},
  {debtorName:"Joanne", item:"Phone", monthlyAmount:2583.00, termMonths:24, startDate:"2025-05-01", balance:15498.00},
  {debtorName:"Kuya", item:"Motor", monthlyAmount:4561.17, termMonths:12, startDate:"2026-09-01", balance:50472.87},
];

/* ---------------- helpers ---------------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + (Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const cryptoId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const slugify = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'user';

async function hashPin(personSlug, pin){
  const data = new TextEncoder().encode('ledger_v1_' + personSlug + '_' + pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

function isInTimeFrame(dateStr, frame){
  const d = new Date(dateStr);
  const now = new Date();
  if (frame === 'daily'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  }
  if (frame === 'weekly'){
    const day = now.getDay();
    const diffToMonday = (day === 0 ? 6 : day - 1);
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+7);
    return d >= weekStart && d < weekEnd;
  }
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
}

function currentPeriod(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

function recurringStatus(r){
  const now = new Date();
  const lastDayOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const effectiveDueDay = Math.min(Number(r.dueDay)||1, lastDayOfMonth);
  const today = now.getDate();
  const paidThisPeriod = r.lastPaidPeriod === currentPeriod();
  if(paidThisPeriod) return { state:'paid', label:'Paid this month', effectiveDueDay };
  if(today < effectiveDueDay) return { state:'upcoming', label:`Due in ${effectiveDueDay-today} day${effectiveDueDay-today===1?'':'s'}`, effectiveDueDay };
  if(today === effectiveDueDay) return { state:'due', label:'Due today', effectiveDueDay };
  return { state:'overdue', label:`Overdue by ${today-effectiveDueDay} day${today-effectiveDueDay===1?'':'s'}`, effectiveDueDay };
}

function defaultProfile(displayName, pinHash){
  return {
    displayName, pinHash,
    budgets: { daily:50, weekly:300, monthly:1000 },
    categories: ['Food','Transportation','Sports','Utilities','Bills','Shopping'],
    moneySources: [
      { id: cryptoId(), name:'GCash', type:'E-Wallet (GCash/PayMaya)', balance:5000 },
      { id: cryptoId(), name:'BDO Debit', type:'Debit Card', balance:25000 },
      { id: cryptoId(), name:'BDO Credit', type:'Credit Card', balance:50000, creditLimit:50000 },
    ],
    savings: 0,
    createdAt: Date.now(),
  };
}

/* ---------------- state ---------------- */
let personId = localStorage.getItem('ledger_person_id') || null;
let profile = null;
let myExpenses = [];
let sharedExpenses = [];
let cardPayments = [];
let payables = [];
let deposits = [];
let receivables = [];
let recurringPayables = [];
let transfers = [];
let adjustments = [];
let pendingSettlements = [];
let timeFrame = localStorage.getItem('ledger_timeframe');
if(timeFrame !== 'weekly' && timeFrame !== 'monthly') timeFrame = 'weekly';
let activeTab = 'tracker';
let gateStep = 'name'; // name | pin-existing | pin-new
let gateName = '';
let unsubProfile=null, unsubMine=null, unsubShared=null, unsubPayments=null, unsubPayables=null, unsubDeposits=null, unsubReceivables=null, unsubRecurring=null, unsubTransfers=null, unsubAdjustments=null, unsubSettlements=null;

function teardownSubs(){
  if(unsubSettlements) unsubSettlements();
  unsubSettlements=null;
  if(unsubTransfers) unsubTransfers();
  unsubTransfers=null;
  if(unsubAdjustments) unsubAdjustments();
  unsubAdjustments=null;
  if(unsubProfile) unsubProfile();
  if(unsubMine) unsubMine();
  if(unsubShared) unsubShared();
  if(unsubPayments) unsubPayments();
  if(unsubPayables) unsubPayables();
  if(unsubDeposits) unsubDeposits();
  if(unsubReceivables) unsubReceivables();
  if(unsubRecurring) unsubRecurring();
  unsubProfile=unsubMine=unsubShared=unsubPayments=unsubPayables=unsubDeposits=unsubReceivables=unsubRecurring=null;
}

function logout(){
  teardownSubs();
  localStorage.removeItem('ledger_person_id');
  personId=null; profile=null; myExpenses=[]; sharedExpenses=[]; cardPayments=[]; payables=[]; deposits=[]; receivables=[]; recurringPayables=[]; transfers=[]; adjustments=[]; pendingSettlements=[];
  gateStep='name'; gateName='';
  renderRoot();
}

const todayStr = ()=> new Date().toLocaleDateString('en-CA');
const dayNum = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/86400000; };
let interestChecked = false;

async function accrueInterest(){
  if(interestChecked || !personId) return;
  interestChecked = true;
  const today = todayStr();
  const credited = [];
  try{
    await runTransaction(db, async tx=>{
      credited.length = 0;
      const ref = doc(db,'people',personId);
      const snap = await tx.get(ref);
      if(!snap.exists()) return;
      let changed = false;
      const updated = (snap.data().moneySources||[]).map(s=>{
        const rate = Number(s.interestRate)||0;
        if(rate<=0 || !s.lastInterestDate || s.lastInterestDate>=today) return s;
        const days = Math.min(400, dayNum(today)-dayNum(s.lastInterestDate));
        let bal = Number(s.balance), total = 0;
        for(let i=0;i<days;i++){
          const inc = Math.round(bal*rate/100/365*100)/100;
          bal += inc; total += inc;
        }
        changed = true;
        if(total>0) credited.push({ sourceId:s.id, sourceName:s.name, amount:Math.round(total*100)/100, days, rate });
        return { ...s, balance: Math.round(bal*100)/100, lastInterestDate: today };
      });
      if(changed) tx.update(ref, { moneySources: updated });
    });
    for(const c of credited){
      await addDoc(collection(db,'people',personId,'deposits'), {
        sourceId:c.sourceId, sourceName:c.sourceName, amount:c.amount,
        note:`Interest ${c.rate}% p.a. (${c.days} day${c.days===1?'':'s'})`, date:new Date().toISOString(), createdAt:Date.now()
      });
    }
    if(credited.length) toast('Interest credited');
  }catch(err){ console.error(err); }
}

/* ---------------- gate flow ---------------- */
async function gateContinue(){
  const errEl = $('#gate-err');
  if(errEl) errEl.textContent = '';

  if(gateStep === 'name'){
    const nameInput = $('#gate-name-input');
    const name = nameInput.value.trim();
    if(!name){ if(errEl) errEl.textContent = 'Enter your name.'; return; }
    gateName = name;
    const slug = slugify(name);
    const snap = await getDoc(doc(db,'people',slug));
    gateStep = snap.exists() ? 'pin-existing' : 'pin-new';
    renderRoot();
    return;
  }

  if(gateStep === 'pin-existing'){
    const pin = $('#gate-pin-input').value.trim();
    if(!/^\d{4}$/.test(pin)){ if(errEl) errEl.textContent = 'Enter your 4-digit PIN.'; return; }
    const slug = slugify(gateName);
    const snap = await getDoc(doc(db,'people',slug));
    if(!snap.exists()){ gateStep='pin-new'; renderRoot(); return; }
    const data = snap.data();
    const hash = await hashPin(slug, pin);
    if(hash !== data.pinHash){ if(errEl) errEl.textContent = 'Wrong PIN. Try again.'; return; }
    personId = slug;
    localStorage.setItem('ledger_person_id', slug);
    subscribeAll();
    renderRoot();
    return;
  }

  if(gateStep === 'pin-new'){
    const pin = $('#gate-pin-input').value.trim();
    const pin2 = $('#gate-pin-confirm').value.trim();
    if(!/^\d{4}$/.test(pin)){ if(errEl) errEl.textContent = 'PIN must be exactly 4 digits.'; return; }
    if(pin !== pin2){ if(errEl) errEl.textContent = 'PINs don\'t match.'; return; }
    const slug = slugify(gateName);
    const hash = await hashPin(slug, pin);
    await setDoc(doc(db,'people',slug), defaultProfile(gateName, hash));
    personId = slug;
    localStorage.setItem('ledger_person_id', slug);
    subscribeAll();
    renderRoot();
    return;
  }
}

function gateBack(){
  gateStep = 'name';
  renderRoot();
}

/* ---------------- main app render ---------------- */
function splitAmountOf(e){
  if(Number(e.splitAmount)>0) return Number(e.splitAmount);
  if(!e.splitPayableId) return 0;
  const p = payables.find(x=>x.id===e.splitPayableId);
  return p ? Number(p.amount)||0 : 0;
}
function myShare(e){
  return Math.max(0, Number(e.amount||0) - splitAmountOf(e));
}

function totalsFor(expenses, frame, budgets){
  const filtered = expenses.filter(e=>isInTimeFrame(e.date, frame));
  const spent = filtered.filter(e=>!BUDGET_EXCLUDED_CATEGORIES.includes(e.category)).reduce((s,e)=>s+myShare(e),0);
  const budget = frame==='daily'?budgets.daily:frame==='weekly'?budgets.weekly:budgets.monthly;
  const remaining = Math.min(Math.max(budget-spent,0), budget);
  return { spent, budget, remaining, filtered };
}

function renderApp(){
  const app = $('#app');
  const totals = totalsFor(myExpenses, timeFrame, profile.budgets);
  const totalBalance = profile.moneySources.reduce((s,m)=>s+Number(m.balance||0),0);
  const isOver = totals.spent > totals.budget;
  const isWarn = !isOver && totals.remaining < totals.budget*0.2;
  const gaugeColor = isOver ? 'var(--brick)' : isWarn ? 'var(--amber)' : 'var(--peso)';
  const pct = totals.budget>0 ? Math.min(totals.spent/totals.budget,1)*100 : 0;
  const tfLabel = {weekly:'Weekly',monthly:'Monthly'}[timeFrame];

  app.innerHTML = `
    <div class="topbar">

      <button class="tab ${activeTab==='receivables'?'active':''}" data-tab="receivables">Receivables</button>

    </div>` : ''}
    <div id="tab-content"></div>
    <footer class="security-note">PIN protection is for convenience, not encryption — keep this link within trusted family/friends.</footer>
  `;

  const paidSoFar = Math.max(0, total - Number(r.balance));

  const isPaidOff = Number(r.balance) <= 0;
  return `
  <div class="loan-card">
    <div class="loan-top">
      <div><div class="name" style="font-weight:600">${esc(r.debtorName)}${r.payableId ? ' <span class="tag person">Shared</span>' : ''}</div><div class="type">${esc(r.item)}</div></div>
      <div class="mono ledger-amt" style="color:${isPaidOff?'var(--peso)':'var(--brick)'}">${isPaidOff ? 'Paid off' : peso(r.balance)}</div>

    <div class="loan-figures"><span>${peso(paidSoFar)} paid</span><span>of ${peso(total)} · ${peso(r.monthlyAmount)}/mo</span></div>

      <button class="pay-btn secondary" data-bill-installment="${esc(r.id)}">Bill Next Month</button>

    ${!archived && isPaidOff ? `
    <div class="loan-actions">
      <button class="pay-btn" data-archive-receivable="${esc(r.id)}">Archive</button>
    </div>` : ''}
    ${archived ? `

function openResolveSettlementModal(id){
  const s = pendingSettlements.find(x=>x.id===id);
  if(!s) return;
  const paying = s.pendingKind==='pay';
  const srcOptions = profile.moneySources.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${peso(x.balance)})</option>`).join('')
    + `<option value="external">External / not tracked in app</option>`;

      <div class="modal">
        <div class="modal-head"><h2>${paying ? `You paid ${esc(s.otherName)}` : `${esc(s.otherName)} paid you`}</h2><button class="x-btn" id="modal-x">&times;</button></div>

        <div class="field"><label>${paying ? 'Paid from' : 'Deposit into'}</label><select id="rs-acct">${srcOptions}</select></div>
        <div class="field-hint">${paying ? 'Takes the money out of that account.' : 'Adds the money to that account and logs a deposit.'}</div>
        <div class="err-text" id="modal-err"></div>
        <div class="btn-row">
          <button class="btn ghost" id="modal-cancel">Cancel</button>
          <button class="btn" id="modal-save">Confirm</button>
        </div>
      </div>
    </div>`;
  $('#modal-x').onclick = closeModal;
  $('#modal-cancel').onclick = closeModal;
  $('#modal-overlay').addEventListener('click', ev=>{ if(ev.target.id==='modal-overlay') closeModal(); });
  $('#modal-save').onclick = async ()=>{
    const acctId = $('#rs-acct').value;
    const src = acctId!=='external' ? profile.moneySources.find(x=>x.id===acctId) : null;
    $('#modal-save').textContent = 'Saving…';
    $('#modal-save').disabled = true;
    try{
      if(src){
        const amount = Number(s.amount);
        const delta = paying ? -amount : amount;
        const updatedSources = profile.moneySources.map(x => x.id===src.id ? {...x, balance: Math.round((Number(x.balance)+delta)*100)/100} : x);
        await updateDoc(doc(db,'people',personId), { moneySources: updatedSources });
        if(paying){
          await addDoc(collection(db,'people',personId,'adjustments'), {
            sourceId: src.id, sourceName: src.name, amount: -amount, kind:'Payable paid', note:`Paid ${s.otherName}`, date:new Date().toISOString(), createdAt:Date.now()
          });
        }else{
          await addDoc(collection(db,'people',personId,'deposits'), {
            sourceId: src.id, sourceName: src.name, amount, note:`Payment from ${s.otherName}`, date:new Date().toISOString(), createdAt:Date.now()
          });
        }
      }
      await updateDoc(doc(db,'settlements',s.id), { resolved:true, resolvedAt:new Date().toISOString() });
      closeModal();
      toast('Recorded');
    }catch(err){
      console.error(err);
      $('#modal-err').textContent = 'Could not save — try again.';
      $('#modal-save').textContent = 'Confirm';
      $('#modal-save').disabled = false;
    }
  };
}

async function settlePayableDoc(p){
  await updateDoc(doc(db,'payables',p.id), { settled:true, settledAt: new Date().toISOString() });
  if(p.receivableId && p.receivableOwnerId){
    await updateDoc(doc(db,'people',p.receivableOwnerId,'receivables',p.receivableId), { balance: 0 });
  }
}

async function syncReceivablePayable(r, newBalance){
  if(!r || !r.payableId) return;
  const settled = newBalance <= 0;
  await updateDoc(doc(db,'payables',r.payableId), {
    amount: Math.max(0, Math.round(newBalance*100)/100), settled, settledAt: settled ? new Date().toISOString() : null
  });
}

function peopleBalancesHtml(){
  const open = payables.filter(p=>!p.settled && (p.fromId===personId || p.toId===personId));
  const map = {};
  open.forEach(p=>{
    const iAmCreditor = p.fromId===personId;
    const otherId = iAmCreditor ? p.toId : p.fromId;
    const otherName = iAmCreditor ? p.toName : p.fromName;
    const m = map[otherId] || (map[otherId] = { name:otherName, owedToMe:0, iOwe:0, count:0 });
    if(iAmCreditor) m.owedToMe += Number(p.amount)||0; else m.iOwe += Number(p.amount)||0;
    m.count++;
  });
  const entries = Object.entries(map);
  if(!entries.length) return '';
  const totalOwedToMe = entries.reduce((s,[,m])=>s+m.owedToMe,0);
  const totalIOwe = entries.reduce((s,[,m])=>s+m.iOwe,0);
  const rows = entries.map(([id,m])=>{
    const net = m.owedToMe - m.iOwe;
    const color = net>=0 ? 'var(--peso)' : 'var(--brick)';
    const breakdown = [
      m.owedToMe>0 ? `owes you ${peso(m.owedToMe)}` : '',
      m.iOwe>0 ? `you owe ${peso(m.iOwe)}` : ''
    ].filter(Boolean).join(' · ');
    return `
    <div class="ledger-row">
      <div class="ledger-main">
        <div class="ledger-cat">${esc(m.name)}</div>
        <div class="ledger-meta">${breakdown} · ${m.count} open</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <div class="mono ledger-amt" style="color:${color}">${net>=0?'':'-'}${peso(Math.abs(net))}</div>
        <button class="pay-btn" data-settle-all="${esc(id)}">Settle all</button>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="row-between"><h3>Balances with people</h3></div>
      <div class="stat-grid" style="margin-bottom:6px">
        <div class="stat-tile"><div class="label">Owed to you</div><div class="mono value" style="color:var(--peso)">${peso(totalOwedToMe)}</div></div>
        <div class="stat-tile"><div class="label">You owe</div><div class="mono value" style="color:var(--brick)">${peso(totalIOwe)}</div></div>
      </div>
      ${rows}
    </div>`;
}

function settleAllWith(otherId){
  const open = payables.filter(p=>!p.settled && ((p.fromId===personId && p.toId===otherId) || (p.toId===personId && p.fromId===otherId)));
  openSettleModal(open);
}

async function openSettleModal(list){
  if(!list.length) return;
  const round2 = n => Math.round(n*100)/100;
  const owedToMe = list.filter(p=>p.fromId===personId).reduce((s,p)=>s+Number(p.amount),0);
  const iOwe = list.filter(p=>p.toId===personId).reduce((s,p)=>s+Number(p.amount),0);
  const net = round2(owedToMe - iOwe);
  const receiving = net > 0, paying = net < 0, amount = Math.abs(net);
  const first = list[0];
  const otherName = first.fromId===personId ? first.toName : first.fromName;
  const otherId = first.fromId===personId ? first.toId : first.fromId;
  let otherSources = [];
  if(amount>0){
    try{
      const otherSnap = await getDoc(doc(db,'people',otherId));
      if(otherSnap.exists()) otherSources = otherSnap.data().moneySources || [];
    }catch(err){ console.error(err); }
  }
  const otherOptions = `<option value="ask">Let ${esc(otherName)} choose later</option>`
    + otherSources.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.type)}</option>`).join('')
    + `<option value="external">External / not tracked in app</option>`;
  const title = receiving ? `${otherName} is paying you` : paying ? `Pay ${otherName}` : `Settle with ${otherName}`;
  const sub = `Marks ${list.length} payable${list.length===1?'':'s'} as settled (${peso(owedToMe)} owed to you, ${peso(iOwe)} you owe).`;
  const srcOptions = profile.moneySources.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${peso(s.balance)})</option>`).join('')
    + `<option value="external">External / not tracked in app</option>`;

  $('#modal-root').innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-head"><h2>${esc(title)}</h2><button class="x-btn" id="modal-x">&times;</button></div>
        <div class="modal-sub">${sub}</div>
        ${amount>0 ? `
        <div class="field"><label>${receiving ? 'Amount received' : 'Amount you pay'}</label><div class="mono" style="font-size:22px;font-weight:600;color:${receiving?'var(--peso)':'var(--brick)'}">${peso(amount)}</div></div>
        <div class="field"><label>${receiving ? 'Your account (money goes into)' : 'Your account (money comes from)'}</label><select id="st-acct">${srcOptions}</select></div>
        <div class="field"><label>${receiving ? `${esc(otherName)}'s account (money comes from)` : `${esc(otherName)}'s account (money goes into)`}</label><select id="st-other">${otherOptions}</select></div>
        <div class="field-hint">You can see the names of ${esc(otherName)}'s accounts but not their balances. Picking one updates their balance and logs it on their side too; "choose later" sends them a prompt instead.</div>`
        : `<div class="field-hint">These offset each other exactly, so no money moves.</div>`}
        <div class="err-text" id="modal-err"></div>
        <div class="btn-row">
          <button class="btn ghost" id="modal-cancel">Cancel</button>
          <button class="btn" id="modal-save">${receiving ? 'Confirm payment received' : paying ? 'Confirm payment' : 'Settle'}</button>
        </div>
      </div>
    </div>`;
  $('#modal-x').onclick = closeModal;
  $('#modal-cancel').onclick = closeModal;
  $('#modal-overlay').addEventListener('click', ev=>{ if(ev.target.id==='modal-overlay') closeModal(); });
  $('#modal-save').onclick = async ()=>{
    const acctId = amount>0 ? $('#st-acct').value : 'external';
    const src = acctId!=='external' ? profile.moneySources.find(s=>s.id===acctId) : null;
    const saveBtn = $('#modal-save');
    const label = saveBtn.textContent;
    saveBtn.textContent = 'Saving…';
    saveBtn.disabled = true;
    try{
      for(const p of list) await settlePayableDoc(p);
      if(amount>0){
        const otherChoice = $('#st-other').value;
        if(otherChoice==='ask'){
          await addDoc(collection(db,'settlements'), {
            pendingFor: otherId, pendingKind: receiving ? 'pay' : 'receive', amount,
            otherId: personId, otherName: profile.displayName,
            resolved: false, date: new Date().toISOString(), createdAt: Date.now()
          });
        }else if(otherChoice!=='external'){
          const theirSource = otherSources.find(s=>s.id===otherChoice);
          const delta = receiving ? -amount : amount;
          await runTransaction(db, async tx=>{
            const ref = doc(db,'people',otherId);
            const snap = await tx.get(ref);
            const updated = (snap.data().moneySources||[]).map(s=>{
              if(s.id!==otherChoice) return s;
              let nb = Number(s.balance)+delta;
              const limit = Number(s.creditLimit)||0;
              if(delta>0 && s.type==='Credit Card' && limit>0) nb = Math.min(nb, limit);
              return {...s, balance: round2(nb)};
            });
            tx.update(ref, { moneySources: updated });
          });
          if(receiving){
            await addDoc(collection(db,'people',otherId,'adjustments'), {
              sourceId: otherChoice, sourceName: theirSource ? theirSource.name : '', amount: -amount, kind:'Payable paid',
              note:`Paid ${profile.displayName}`, date:new Date().toISOString(), createdAt:Date.now()
            });
          }else{
            await addDoc(collection(db,'people',otherId,'deposits'), {
              sourceId: otherChoice, sourceName: theirSource ? theirSource.name : '', amount,
              note:`Payment from ${profile.displayName}`, date:new Date().toISOString(), createdAt:Date.now()
            });
          }
        }
      }
      if(src && amount>0){
        const delta = receiving ? amount : -amount;
        const updatedSources = profile.moneySources.map(s => s.id===src.id ? {...s, balance: round2(Number(s.balance)+delta)} : s);
        await updateDoc(doc(db,'people',personId), { moneySources: updatedSources });
        if(receiving){
          await addDoc(collection(db,'people',personId,'deposits'), {
            sourceId: src.id, sourceName: src.name, amount, note:`Payment from ${otherName}`, date:new Date().toISOString(), createdAt:Date.now()
          });
        }else{
          await addDoc(collection(db,'people',personId,'adjustments'), {
            sourceId: src.id, sourceName: src.name, amount: -amount, kind:'Payable paid', note:`Paid ${otherName}`, date:new Date().toISOString(), createdAt:Date.now()
          });
        }
      }
      closeModal();
      toast(`Settled with ${otherName}`);
    }catch(err){
      console.error(err);
      $('#modal-err').textContent = 'Could not save — try again.';
      saveBtn.textContent = label;
      saveBtn.disabled = false;
    }
  };
}

function payablesTabHtml(){
  const creditCards = profile.moneySources.filter(s=>s.type==='Credit Card');
  const totalCreditUsed = creditCards.reduce((sum,c)=>{
    const limit = Number(c.creditLimit)||0;
    const used = limit>0 ? Math.max(0, limit - Number(c.balance)) : 0;
    return sum+used;
  },0);
  const myOwedPayables = payables.filter(p=>!p.settled && p.toId===personId);
  const totalOwedToPeople = myOwedPayables.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalPayable = totalCreditUsed + totalOwedToPeople;

  const cardRows = creditCards.map(c=>{
    const limit = Number(c.creditLimit)||0;
    const used = limit>0 ? Math.max(0, limit-Number(c.balance)) : 0;
    const usedPct = limit>0 ? Math.min(100, (used/limit)*100) : 0;
    const gColor = usedPct>90?'var(--brick)':usedPct>70?'var(--amber)':'var(--peso)';
    return `
    <div class="loan-card">
      <div class="loan-top">
        <div><div class="name" style="font-weight:600">${esc(c.name)}</div><div class="type">Credit Card</div></div>
        <div class="mono ledger-amt" style="color:var(--brick)">${peso(used)}</div>
      </div>
      <div class="credit-gauge-track"><div class="credit-gauge-fill" style="width:${usedPct}%; background:${gColor}"></div></div>
      <div class="loan-figures"><span>${peso(used)} used</span><span>of ${peso(limit)} limit</span></div>
      <div class="loan-actions"><button class="pay-btn" data-pay-card="${esc(c.id)}">Pay this card</button></div>
    </div>`;
  }).join('') || `<div class="empty-note">No credit cards yet — add one in Settings.</div>`;

  const peopleRows = myOwedPayables.map(p=>`
    <div class="ledger-row">
      <div class="ledger-main">
        <div class="ledger-cat">You owe ${esc(p.fromName)}</div>
        <div class="ledger-meta">${esc(p.category)} · ${new Date(p.date).toLocaleDateString('en-PH',{month:'short',day:'numeric'})}</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <div class="mono ledger-amt" style="color:var(--brick)">${peso(p.amount)}</div>
        <button class="pay-btn" data-settle-payable="${esc(p.id)}">Mark settled</button>
      </div>
    </div>`).join('') || `<div class="empty-note">You don't owe anyone right now.</div>`;

  const creditExpenses = myExpenses.filter(e=>e.paymentMethod==='Credit Card').slice(0,50);
  const creditExpenseRows = creditExpenses.map(e=>`
    <div class="ledger-row">
      <div class="ledger-main">
        <div class="ledger-cat">${esc(e.category)}</div>
        <div class="ledger-meta">${new Date(e.date).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${esc(e.moneySource)}</div>
        ${e.notes ? `<div class="ledger-meta">${esc(e.notes)}</div>` : ''}
      </div>
      <div class="mono ledger-amt">-${peso(e.amount)}</div>
    </div>`).join('') || `<div class="empty-note">No credit card purchases yet.</div>`;

  const dueOrOverdue = recurringPayables
    .map(r=>({r, status:recurringStatus(r)}))
    .filter(x=>x.status.state==='due' || x.status.state==='overdue');

  const bannerHtml = dueOrOverdue.map(({r,status})=>`
    <div class="card" style="border-color:var(--brick); background:var(--brick-soft); margin-bottom:10px;">
      <div class="row-between">
        <div><div style="font-weight:700; color:var(--brick)">⚠ ${esc(r.description)}</div><div class="ledger-meta" style="color:var(--brick)">${peso(r.amount)} — ${status.label}</div></div>
        <button class="pay-btn" data-mark-recurring-paid="${esc(r.id)}">Mark Paid</button>
      </div>
    </div>`).join('');

  const recurringRows = recurringPayables.map(r=>{
    const status = recurringStatus(r);
    const color = status.state==='paid' ? 'var(--peso)' : (status.state==='upcoming' ? 'var(--muted)' : 'var(--brick)');
    return `
    <div class="loan-card">
      <div class="loan-top">
        <div><div class="name" style="font-weight:600">${esc(r.description)}</div><div class="type">Due on day ${r.dueDay} of the month</div></div>
        <div class="mono ledger-amt">${peso(r.amount)}</div>
      </div>
      <div class="loan-figures"><span style="color:${color}; font-weight:600">${status.label}</span></div>
      <div class="loan-actions">
        ${status.state!=='paid' ? `<button class="pay-btn" data-mark-recurring-paid="${esc(r.id)}">Mark Paid</button>` : ''}
        <button class="pay-btn secondary" data-remove-recurring="${esc(r.id)}">Remove</button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-note">No recurring bills yet.</div>`;

  return `
    ${pendingSettlementsHtml()}
    ${bannerHtml}

    <div class="btn-pair">
      <button class="btn outline-ballpen" id="open-add-recurring">+ Recurring Bill</button>
      <button class="btn ghost" id="open-settings-payables">Settings</button>
    </div>

    <div class="stat-grid" style="grid-template-columns:1fr">
      <div class="stat-tile"><div class="label">Total Payable</div><div class="mono value" style="color:var(--brick)">${peso(totalPayable)}</div></div>
    </div>

    ${peopleBalancesHtml()}
    <div class="card"><h3>Credit Cards</h3>${cardRows}</div>
    <div class="card"><h3>Owed to People</h3>${peopleRows}</div>

    <div class="card">
      <div class="row-between"><h3>Recurring Bills</h3></div>
      ${recurringRows}
    </div>

    <div class="card"><h3>Credit Card Purchases</h3>${creditExpenseRows}</div>
  `;
}

function sharedTabHtml(tfLabel){
  const inFrame = sharedExpenses.filter(e=>isInTimeFrame(e.date, timeFrame));
  const total = inFrame.reduce((s,e)=>s+Number(e.amount||0),0);
  const byPerson = {}, byCategory = {};
  inFrame.forEach(e=>{
    byPerson[e.ownerName] = (byPerson[e.ownerName]||0) + Number(e.amount||0);
    byCategory[e.category] = (byCategory[e.category]||0) + Number(e.amount||0);
  });
  const people = new Set(inFrame.map(e=>e.ownerName));
  const personEntries = Object.entries(byPerson).sort((a,b)=>b[1]-a[1]);
  const catEntries = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  const maxPerson = Math.max(1, ...personEntries.map(e=>e[1]));
  const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));

  const barRows = (entries, max, color) => entries.map(([label,val])=>`
    <div class="bar-row">
      <div class="bar-label" title="${esc(label)}">${esc(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(val/max*100).toFixed(1)}%; background:${color}"></div></div>
      <div class="bar-val mono">${peso(val)}</div>
    </div>`).join('') || `<div class="empty-note">Nothing yet.</div>`;

  const feed = sharedExpenses.slice(0,20).map(e=>`
    <div class="ledger-row">
      <div class="ledger-main">
        <div class="ledger-cat">${esc(e.category)}</div>
        <div class="ledger-meta">${new Date(e.date).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
        <div class="ledger-tags"><span class="tag person">${esc(e.ownerName)}</span></div>
      </div>
      <div class="mono ledger-amt">-${peso(e.amount)}</div>
    </div>`).join('') || `<div class="empty-note">No shared activity yet.</div>`;

  const openPayables = payables.filter(p=>!p.settled);
  const settledPayables = payables.filter(p=>p.settled).slice(0,10);
  const payableRow = p => `
    <div class="ledger-row">
      <div class="ledger-main">
        <div class="ledger-cat">${esc(p.toName)} owes ${esc(p.fromName)}</div>
        <div class="ledger-meta">${esc(p.category)} · ${new Date(p.date).toLocaleDateString('en-PH',{month:'short',day:'numeric'})}</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <div class="mono ledger-amt" style="color:${p.settled?'var(--muted)':'var(--brick)'}">${peso(p.amount)}</div>
        ${p.settled ? `<span class="tag">Settled</span>` : `<button class="pay-btn" data-settle-payable="${esc(p.id)}">Mark settled</button>`}
      </div>
    </div>`;
  const payablesHtml = openPayables.length
    ? openPayables.map(payableRow).join('')
    : `<div class="empty-note">No open payables. Add an expense and check "Someone else owes part of this" to split one.</div>`;
  const settledHtml = settledPayables.length ? settledPayables.map(payableRow).join('') : '';

  return `
    <div class="stat-grid">
      <div class="stat-tile"><div class="label">Total (${tfLabel})</div><div class="mono value">${peso(total)}</div></div>
      <div class="stat-tile"><div class="label">Contributors</div><div class="mono value">${people.size}</div></div>
    </div>
    ${peopleBalancesHtml()}
    <div class="card"><h3>Payables</h3>${payablesHtml}</div>
    ${settledHtml ? `<div class="card"><h3>Recently Settled</h3>${settledHtml}</div>` : ''}
    <div class="card"><h3>By Category</h3>${barRows(catEntries, maxCat, 'var(--ballpen)')}</div>
    <div class="card"><h3>By Person</h3>${barRows(personEntries, maxPerson, 'var(--peso)')}</div>
    <div class="card"><h3>Recent Activity</h3>${feed}</div>
  `;
}

async function submitCardPayment(cardId){
  const amount = parseFloat($('#p-amount').value);
  const fromId = $('#p-from').value;
  const errEl = $('#modal-err');
  if(!amount || amount<=0){ errEl.textContent='Enter a valid payment amount.'; return; }

  const card = profile.moneySources.find(s=>s.id===cardId);
  if(!card){ errEl.textContent='Card not found.'; return; }
  const fromSource = fromId!=='external' ? profile.moneySources.find(s=>s.id===fromId) : null;
  if(fromId!=='external' && !fromSource){ errEl.textContent='Select where this payment came from.'; return; }

  $('#modal-save').textContent = 'Saving…';
  $('#modal-save').disabled = true;
  try{
    const limit = Number(card.creditLimit)||Infinity;
    const newCardBalance = Math.min(Number(card.balance)+amount, limit);
    const updatedSources = profile.moneySources.map(s=>{
      if(s.id===cardId) return {...s, balance:newCardBalance};
      if(fromSource && s.id===fromSource.id) return {...s, balance:Number(s.balance)-amount};
      return s;
    });
    await updateDoc(doc(db,'people',personId), { moneySources: updatedSources });
    await addDoc(collection(db,'people',personId,'payments'), {
      cardId, cardName: card.name, amount,
      from: fromSource ? fromSource.name : 'External',
      date: new Date().toISOString(), createdAt: Date.now()
    });
    closeModal();
    toast('Payment recorded');
  }catch(err){
    console.error(err);
    errEl.textContent = 'Could not save — check your connection and try again.';
    $('#modal-save').textContent = 'Record Payment';
    $('#modal-save').disabled = false;
  }
}

  $('#ar-from').onchange = ()=>{

          fromId: personId, fromName: profile.displayName,
          toId: linkedId, toName: debtorName,
          amount: balance, category: item, date: new Date().toISOString(), createdAt: Date.now(), settled: false,
          receivableId: recRef.id, receivableOwnerId: personId
        });
        await updateDoc(recRef, { payableId: payRef.id });
      }
      if(fromSource){
        const updatedSources = profile.moneySources.map(s => s.id===fromSource.id ? {...s, balance: Math.round((Number(s.balance)-lent)*100)/100} : s);
        await updateDoc(doc(db,'people',personId), { moneySources: updatedSources });

          sourceId: fromSource.id, sourceName: fromSource.name, amount: -lent, kind:'Loan given',

      errEl.textContent = 'Could not save — try again.';
      $('#modal-save').textContent = 'Add Receivable';
      $('#modal-save').disabled = false;

function closeModal(){ $('#modal-root').innerHTML = ''; }

function askChoice(title, message, buttons){
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="modal-overlay" style="z-index:80">
      <div class="modal" style="max-width:380px">
        <div class="modal-head"><h2>${esc(title)}</h2></div>
        <div class="modal-sub">${esc(message)}</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-choice="${i}">${esc(b.label)}</button>`).join('')}
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.querySelectorAll('[data-choice]').forEach(btn=>{
    btn.onclick = async ()=>{
      el.remove();
      const run = buttons[Number(btn.dataset.choice)].run;
      if(run) await run();
    };
  });
}

async function submitExpense(){
  const amount = parseFloat($('#f-amount').value);
  const category = $('#f-category').value;
  const paymentMethod = $('#f-payment').value;
  const sourceId = $('#f-source').value;
  const notes = $('#f-notes').value.trim();
  const errEl = $('#modal-err');

  if(!amount || amount<=0){ errEl.textContent='Enter a valid amount.'; return; }
  const source = profile.moneySources.find(s=>s.id===sourceId);
  if(!category || !paymentMethod || !source){ errEl.textContent='Please fill in all required fields.'; return; }

  const splitToggle = $('#f-split-toggle');
  const isSplit = splitToggle && splitToggle.checked;
  let splitWhoId = null, splitWhoName = null, splitAmount = 0;
  if(isSplit){
    splitWhoId = $('#f-split-who').value;
    splitAmount = parseFloat($('#f-split-amount').value);
    if(!splitWhoId){ errEl.textContent='Choose who owes part of this.'; return; }
    if(!splitAmount || splitAmount<=0){ errEl.textContent='Enter a valid amount owed.'; return; }
    splitWhoName = $('#f-split-who').selectedOptions[0].textContent;
  }

  $('#modal-save').textContent = 'Saving…';
  $('#modal-save').disabled = true;
  try{
    const dateIso = new Date().toISOString();
    const sharedRef = await addDoc(collection(db,'sharedExpenses'), {
      ownerId: personId, ownerName: profile.displayName, amount, category, date: dateIso, createdAt: Date.now()
    });
    const expenseRef = await addDoc(collection(db,'people',personId,'expenses'), {
      amount, category, paymentMethod, moneySource: source.name, moneySourceId: source.id, notes, date: dateIso, createdAt: Date.now(), sharedId: sharedRef.id
    });
    const updatedSources = profile.moneySources.map(s => s.id===sourceId ? {...s, balance: Number(s.balance)-amount} : s);
    await updateDoc(doc(db,'people',personId), { moneySources: updatedSources });
    if(isSplit){
      const payRef = await addDoc(collection(db,'payables'), {
        fromId: personId, fromName: profile.displayName,
        toId: splitWhoId, toName: splitWhoName,
        amount: splitAmount, category, date: dateIso, createdAt: Date.now(), settled: false
      });
      await updateDoc(expenseRef, { splitPayableId: payRef.id, splitWho: splitWhoName, splitAmount });
    }
    closeModal();
    toast('Expense added');
  }catch(err){
    console.error(err);
    errEl.textContent = 'Could not save — check your connection and try again.';
    $('#modal-save').textContent = 'Add Expense';
    $('#modal-save').disabled = false;
  }
}

/* ---------------- modal: account transactions ---------------- */
function accountTransactions(s){
  const rows = [];
  myExpenses.forEach(e=>{
    const match = e.moneySourceId ? e.moneySourceId===s.id : e.moneySource===s.name;
    if(match) rows.push({ date:e.date, kind:'Expense', label:e.category + (e.notes ? ' · ' + e.notes : ''), amount:-Number(e.amount) });
  });
  deposits.forEach(d=>{
    if(d.sourceId===s.id) rows.push({ date:d.date, kind:'Deposit', label:d.note || 'Deposit', amount:Number(d.amount) });
  });
  cardPayments.forEach(p=>{
    if(p.cardId===s.id) rows.push({ date:p.date, kind:'Card payment', label:`Payment received · from ${p.from}`, amount:Number(p.amount) });
    else if(p.from===s.name) rows.push({ date:p.date, kind:'Card payment', label:`Paid ${p.cardName}`, amount:-Number(p.amount) });
  });
  adjustments.forEach(a=>{
    if(a.sourceId===s.id) rows.push({ date:a.date, kind:a.kind, label:a.note || a.kind, amount:Number(a.amount) });
  });
  transfers.forEach(t=>{
    if(t.fromId===s.id) rows.push({ date:t.date, kind:'Transfer', label:`To ${t.toName}` + (t.note ? ' · ' + t.note : ''), amount:-Number(t.amount) });
    if(t.toId===s.id) rows.push({ date:t.date, kind:'Transfer', label:`From ${t.fromName}` + (t.note ? ' · ' + t.note : ''), amount:Number(t.amount) });
  });
  return rows.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

  $('#modal-cancel').onclick = closeModal;
  $('#modal-overlay').addEventListener('click', ev=>{ if(ev.target.id==='modal-overlay') closeModal(); });
  $('#modal-save').onclick = async ()=>{
    const fromId = $('#t-from').value, toId = $('#t-to').value;
    const amount = parseFloat($('#t-amount').value);
    const note = $('#t-note').value.trim();
    const errEl = $('#modal-err');
    if(fromId===toId){ errEl.textContent='Pick two different accounts.'; return; }
    if(!amount || amount<=0){ errEl.textContent='Enter a valid amount.'; return; }
    const from = profile.moneySources.find(s=>s.id===fromId);
    const to = profile.moneySources.find(s=>s.id===toId);
    $('#modal-save').textContent = 'Saving…';
    $('#modal-save').disabled = true;
    try{
      const round2 = n => Math.round(n*100)/100;
      const updatedSources = profile.moneySources.map(s=>{
        if(s.id===fromId) return {...s, balance: round2(Number(s.balance)-amount)};
        if(s.id===toId){
          const nb = Number(s.balance)+amount;
          const limit = Number(s.creditLimit)||0;
          return {...s, balance: round2(s.type==='Credit Card' && limit>0 ? Math.min(nb, limit) : nb)};

      await addDoc(collection(db,'people',personId,'transfers'), {
        fromId, fromName: from.name, toId, toName: to.name, amount, note, date: new Date().toISOString(), createdAt: Date.now()
      });
      closeModal();
      toast('Transfer complete');
    }catch(err){
      console.error(err);
      errEl.textContent = 'Could not save — try again.';
      $('#modal-save').textContent = 'Transfer';
      $('#modal-save').disabled = false;
    }
  };
}

    const fromAmt = ()=>{ const t=parseFloat(amtIn.value)||0, a=parseFloat(splitAmtIn.value)||0; pctIn.value = t>0 ? round2(a/t*100) : ''; };
    eeToggle.onchange = ()=>{ $('#ee-split-fields').style.display = eeToggle.checked ? '' : 'none'; if(eeToggle.checked) fromPct(); };
    pctIn.addEventListener('input', fromPct);
    splitAmtIn.addEventListener('input', fromAmt);
    amtIn.addEventListener('input', ()=>{ if(eeToggle.checked) fromPct(); });
  }

  $('#modal-save').onclick = async ()=>{
    const amount = parseFloat($('#ee-amount').value);
    const category = $('#ee-category').value;
    const paymentMethod = $('#ee-payment').value;
    const newSourceId = $('#ee-source').value;
    const notes = $('#ee-notes').value.trim();
    const errEl = $('#modal-err');
    if(!amount || amount<=0){ errEl.textContent='Enter a valid amount.'; return; }
    const newSource = profile.moneySources.find(s=>s.id===newSourceId);
    if(!newSource){ errEl.textContent='Select an account.'; return; }
    const doSplit = eeToggle && eeToggle.checked;
    let splitWhoId = null, splitWhoName = null, splitAmount = 0;
    if(doSplit){
      splitWhoId = $('#ee-split-who').value;
      splitAmount = parseFloat($('#ee-split-amount').value);
      if(!splitAmount || splitAmount<=0){ errEl.textContent='Enter a valid amount owed.'; return; }
      splitWhoName = $('#ee-split-who').selectedOptions[0].textContent;
    }
    $('#modal-save').textContent = 'Saving…';
    $('#modal-save').disabled = true;
    try{
      const oldAmount = Number(e.amount);
      const updatedSources = profile.moneySources.map(s=>{
        let bal = Number(s.balance);
        if(oldSource && s.id===oldSource.id) bal += oldAmount;
        if(s.id===newSource.id) bal -= amount;
        return bal===Number(s.balance) ? s : {...s, balance: Math.round(bal*100)/100};
      });
      await updateDoc(doc(db,'people',personId,'expenses',e.id), {
        amount, category, paymentMethod, moneySource: newSource.name, moneySourceId: newSource.id, notes
      });
      await updateDoc(doc(db,'people',personId), { moneySources: updatedSources });
      if(e.sharedId){
        await updateDoc(doc(db,'sharedExpenses',e.sharedId), { amount, category });
      }
      if(doSplit){
        const payRef = await addDoc(collection(db,'payables'), {
          fromId: personId, fromName: profile.displayName,
          toId: splitWhoId, toName: splitWhoName,
          amount: splitAmount, category, date: e.date, createdAt: Date.now(), settled: false
        });
        await updateDoc(doc(db,'people',personId,'expenses',e.id), { splitPayableId: payRef.id, splitWho: splitWhoName, splitAmount });
      }
      closeModal();
      toast(doSplit ? 'Expense updated and payable added' : 'Expense updated');
    }catch(err){
      console.error(err);
      errEl.textContent = 'Could not save — try again.';
      $('#modal-save').textContent = 'Save Changes';
      $('#modal-save').disabled = false;
    }
  };
}

const refreshSettings = scope => setTimeout(()=>renderSettingsModal(scope), 200);

function openSettingsModal(scope){

}

function renderSettingsModal(scope='general'){
  const body = scope==='receivables' ? settingsReceivablesHtml()
    : scope==='payables' ? settingsPayablesHtml()
    : settingsGeneralHtml();

  $('#modal-root').innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-head"><h2>${SETTINGS_TITLES[scope]||'Settings'}</h2><button class="x-btn" id="modal-x">&times;</button></div>
        ${body}
        <div class="err-text" id="modal-err"></div>
        <div class="btn-row"><button class="btn" id="modal-done">Done</button></div>
      </div>
    </div>`;

  const root = $('#modal-root');
  $('#modal-x').onclick = closeModal;
  $('#modal-done').onclick = closeModal;
  $('#modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });

  // shared by General (accounts) and Payables (credit cards)
  root.querySelectorAll('[data-remove-src]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.removeSrc;
      const updated = profile.moneySources.filter(s=>s.id!==id);
      await updateDoc(doc(db,'people',personId), { moneySources: updated });
      profile = { ...profile, moneySources: updated };
      renderSettingsModal(scope);
    };
  });
  root.querySelectorAll('[data-save-balance]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.saveBalance;
      const balInput = root.querySelector(`[data-balance-src="${id}"]`);
      const limitInput = root.querySelector(`[data-limit-src="${id}"]`);
      const interestInput = root.querySelector(`[data-interest-src="${id}"]`);
      const newBal = parseFloat(balInput.value)||0;
      const before = profile.moneySources.find(s=>s.id===id);
      const diff = before ? Math.round((newBal - Number(before.balance))*100)/100 : 0;
      const updated = profile.moneySources.map(s=>{
        if(s.id!==id) return s;
        const next = {...s, balance:newBal};
        if(limitInput) next.creditLimit = parseFloat(limitInput.value)||0;
        if(interestInput){
          const rate = parseFloat(interestInput.value)||0;
          next.interestRate = rate;
          if(rate>0 && !next.lastInterestDate) next.lastInterestDate = todayStr();
        }
        return next;
      });
      await updateDoc(doc(db,'people',personId), { moneySources: updated });
      profile = { ...profile, moneySources: updated };
      if(before && Math.abs(diff)>=0.01){
        await addDoc(collection(db,'people',personId,'adjustments'), {
          sourceId: before.id, sourceName: before.name, amount: diff, kind:'Balance adjustment',
          note:'Balance edited in Settings', date: new Date().toISOString(), createdAt: Date.now()
        });
      }
      toast('Updated');
    };
  });

  if(scope==='general'){
    $('#save-budgets').onclick = async ()=>{
      const daily = Number(profile.budgets.daily)||0;
      const weekly = parseFloat($('#s-weekly').value)||0;
      const monthly = parseFloat($('#s-monthly').value)||0;
      await updateDoc(doc(db,'people',personId), { budgets:{daily,weekly,monthly} });
      toast('Budgets updated');
    };
    $('#save-savings').onclick = async ()=>{
      const savings = parseFloat($('#s-savings').value)||0;
      await updateDoc(doc(db,'people',personId), { savings });
      toast('Savings updated');
    };
    $('#add-cat').onclick = async ()=>{
      const val = $('#new-cat').value.trim();
      if(!val) return;
      if(profile.categories.includes(val)){ toast('Category already exists'); return; }
      await updateDoc(doc(db,'people',personId), { categories:[...profile.categories, val] });
      profile = { ...profile, categories:[...profile.categories, val] };
      renderSettingsModal(scope);
    };
    root.querySelectorAll('[data-remove-cat]').forEach(b=>{
      b.onclick = async ()=>{
        const val = b.dataset.removeCat;
        const updated = profile.categories.filter(c=>c!==val);
        await updateDoc(doc(db,'people',personId), { categories: updated });
        profile = { ...profile, categories: updated };
        renderSettingsModal(scope);
      };
    });
    $('#add-src').onclick = async ()=>{
      const name = $('#new-src-name').value.trim();
      const type = $('#new-src-type').value;
      const balance = parseFloat($('#new-src-balance').value)||0;
      if(!name){ toast('Enter an account name'); return; }
      const updated = [...profile.moneySources, { id: cryptoId(), name, type, balance }];
      await updateDoc(doc(db,'people',personId), { moneySources: updated });
      profile = { ...profile, moneySources: updated };
      renderSettingsModal(scope);
    };
  }

  if(scope==='receivables'){
    root.querySelectorAll('[data-remove-receivable]').forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.removeReceivable;
        const r = receivables.find(x=>x.id===id);
        askChoice(
          `Remove ${r ? r.debtorName + ' · ' + r.item : 'this receivable'}?`,
          'Archive keeps it (and its balance) on the Receivables tab under Archived, where you can restore it. Delete removes it permanently.',
          [
            { label:'Archive', run: async ()=>{ await updateDoc(doc(db,'people',personId,'receivables',id), { archived:true }); toast('Archived'); refreshSettings(scope); } },
            { label:'Delete permanently', cls:'danger', run: async ()=>{ await syncReceivablePayable(r, 0); await deleteDoc(doc(db,'people',personId,'receivables',id)); toast('Deleted'); refreshSettings(scope); } },
            { label:'Cancel', cls:'ghost' }
          ]
        );
      };
    });
    root.querySelectorAll('[data-restore-receivable]').forEach(b=>{
      b.onclick = async ()=>{
        await updateDoc(doc(db,'people',personId,'receivables',b.dataset.restoreReceivable), { archived:false });
        toast('Restored');
        refreshSettings(scope);
      };
    });
    root.querySelectorAll('[data-save-receivable]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.saveReceivable;
        const debtorName = root.querySelector(`[data-rec-name="${id}"]`).value.trim();
        const item = root.querySelector(`[data-rec-item="${id}"]`).value.trim();
        const monthlyAmount = parseFloat(root.querySelector(`[data-rec-monthly="${id}"]`).value)||0;
        const termMonths = parseInt(root.querySelector(`[data-rec-term="${id}"]`).value)||0;
        const startDate = root.querySelector(`[data-rec-start="${id}"]`).value;
        const balance = parseFloat(root.querySelector(`[data-rec-balance="${id}"]`).value)||0;
        if(!debtorName || !item || monthlyAmount<=0 || termMonths<=0 || !startDate){
          toast('Fill in all receivable fields'); return;
        }
        await updateDoc(doc(db,'people',personId,'receivables',id), {
          debtorName, item, monthlyAmount, termMonths, startDate, balance
        });
        await syncReceivablePayable(receivables.find(x=>x.id===id), balance);
        toast('Receivable updated');
        refreshSettings(scope);
      };
    });
    const importBtn = $('#import-receivables');
    if(importBtn){
      importBtn.onclick = async ()=>{
        importBtn.textContent = 'Importing…';
        importBtn.disabled = true;
        try{
          for(const r of RECEIVABLES_IMPORT){
            await addDoc(collection(db,'people',personId,'receivables'), { ...r, createdAt: Date.now() });
          }
          toast('Imported 14 receivables');
          refreshSettings(scope);
        }catch(err){
          console.error(err);
          toast('Import failed partway — check and retry');
          importBtn.textContent = 'Import my 14 receivables';
          importBtn.disabled = false;
        }
      };
    }
  }

  if(scope==='payables'){
    $('#add-card').onclick = async ()=>{
      const name = $('#new-card-name').value.trim();
      const balance = parseFloat($('#new-card-balance').value)||0;
      const creditLimit = parseFloat($('#new-card-limit').value)||0;
      if(!name){ toast('Enter a card name'); return; }
      if(creditLimit<=0){ toast('Enter the credit limit'); return; }
      const updated = [...profile.moneySources, { id: cryptoId(), name, type:'Credit Card', balance, creditLimit }];
      await updateDoc(doc(db,'people',personId), { moneySources: updated });
      profile = { ...profile, moneySources: updated };
      renderSettingsModal(scope);
    };
    root.querySelectorAll('[data-remove-recurring-s]').forEach(b=>{
      b.onclick = async ()=>{
        await deleteDoc(doc(db,'people',personId,'recurringPayables',b.dataset.removeRecurringS));
        toast('Removed');
        refreshSettings(scope);
      };
    });
    root.querySelectorAll('[data-save-recurring]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.saveRecurring;
        const description = root.querySelector(`[data-rb-desc="${id}"]`).value.trim();
        const amount = parseFloat(root.querySelector(`[data-rb-amount="${id}"]`).value)||0;
        const dueDay = parseInt(root.querySelector(`[data-rb-day="${id}"]`).value)||0;
        const category = root.querySelector(`[data-rb-cat="${id}"]`).value;
        if(!description || amount<=0 || dueDay<1 || dueDay>31){ toast('Fill in all fields correctly'); return; }
        await updateDoc(doc(db,'people',personId,'recurringPayables',id), { description, amount, dueDay, category });
        toast('Bill updated');
        refreshSettings(scope);
      };
    });
  }
}

/* ---------------- root render ---------------- */
function render(){
  if(!personId || !profile){ renderGate(); return; }
  renderApp();
}
function renderRoot(){ render(); }

/* ---------------- boot ---------------- */
(async function boot(){
  if(personId){
    const snap = await getDoc(doc(db,'people',personId));
    if(snap.exists()){
      profile = snap.data();
      subscribeAll();
      render();
      return;
    }
    localStorage.removeItem('ledger_person_id');
    personId = null;
  }
  render();
})();
</script>
